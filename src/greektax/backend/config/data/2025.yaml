year: 2025
meta:
  version: 1
  status: final
  notes: "Final 2025 configuration with confirmed family credits and trade fee abolition"
rules:
  # Youth relief age = age_reference_year - birth year (defaults to the tax year).
  age_reference_year: 2026
  youth_bands:
    under_25: 25
    age26_30: 30
  # The reduced youth rates start in tax year 2026 (Law 5246/2025).
  youth_relief_categories: []
  residency_transfer_taxable_share: 0.5
  max_birth_year_with_income: 2025
  salary_credit:
    # Article 16 ΚΦΕ: the credit reduces the tax on salaries and pensions, and on
    # agricultural income where the farmer qualifies; it falls by 20 per 1,000 of
    # that taxable income above 12,000 (not for 5+ dependent children).
    income_categories: [employment, pension, agricultural]
    reduction_threshold: 12000
    reduction_step: 1000
    reduction_per_step: 20
income:
  employment:
    payroll:
      allowed_payments_per_year:
        - 14
        - 12
        - 10
      default_payments_per_year: 14
    contributions:
      employee_rate: 0.1337
      employer_rate: 0.2179
      monthly_salary_cap: 7572.62
    tax_brackets:
      - upper: 10000
        rate: 0.09
      - upper: 20000
        rate: 0.22
      - upper: 30000
        rate: 0.28
      - upper: 40000
        rate: 0.36
      - rate: 0.44
    tax_credit:
      amounts_by_children:
        "0": 777
        "1": 900
        "2": 1120
        "3": 1340
        "4": 1580
        "5": 1780
        "6": 2000
        "7": 2220
        "8": 2440
        "9": 2660
        "10": 2880
        "11": 3100
        "12": 3320
        "13": 3540
        "14": 3760
        "15": 3980
      incremental_amount_per_child: 220
      income_reduction_exempt_from_dependants: 5
  pension:
    payroll:
      allowed_payments_per_year:
        - 14
        - 12
        - 10
      default_payments_per_year: 14
    contributions:
      employee_rate: 0.0
      employer_rate: 0.0
    tax_brackets:
      - upper: 10000
        rate: 0.09
      - upper: 20000
        rate: 0.22
      - upper: 30000
        rate: 0.28
      - upper: 40000
        rate: 0.36
      - rate: 0.44
  freelance:
    tax_brackets:
      - upper: 10000
        rate: 0.09
      - upper: 20000
        rate: 0.22
      - upper: 30000
        rate: 0.28
      - upper: 40000
        rate: 0.36
      - rate: 0.44
    trade_fee:
      standard_amount: 0
      reduced_amount: null
      newly_self_employed_reduction_years: null
    # e-EFKA monthly contributions of non-salaried insured persons for 2025 (main
    # pension and health). Engineers pay the same main classes plus auxiliary
    # and lump-sum classes; class N is shown with auxiliary/lump-sum class N.
    efka_categories:
      - id: general_class_1
        label_key: forms.freelance.efka.category.general_class_1
        monthly_amount: 244.65
      - id: general_class_2
        label_key: forms.freelance.efka.category.general_class_2
        monthly_amount: 293.59
      - id: general_class_3
        label_key: forms.freelance.efka.category.general_class_3
        monthly_amount: 351.84
      - id: general_class_4
        label_key: forms.freelance.efka.category.general_class_4
        monthly_amount: 422.90
      - id: general_class_5
        label_key: forms.freelance.efka.category.general_class_5
        monthly_amount: 506.78
      - id: general_class_6
        label_key: forms.freelance.efka.category.general_class_6
        monthly_amount: 659.39
      - id: general_reduced
        label_key: forms.freelance.efka.category.general_reduced
        monthly_amount: 146.79
        description_key: forms.freelance.efka.category.general_reduced_description
      - id: engineer_class_1
        label_key: forms.freelance.efka.category.engineer_class_1
        monthly_amount: 244.65
        auxiliary_monthly_amount: 45.43
        lump_sum_monthly_amount: 30.29
        description_key: forms.freelance.efka.category.engineer_description
      - id: engineer_class_2
        label_key: forms.freelance.efka.category.engineer_class_2
        monthly_amount: 293.59
        auxiliary_monthly_amount: 54.76
        lump_sum_monthly_amount: 36.12
        description_key: forms.freelance.efka.category.engineer_description
      - id: engineer_class_3
        label_key: forms.freelance.efka.category.engineer_class_3
        monthly_amount: 351.84
        auxiliary_monthly_amount: 65.25
        lump_sum_monthly_amount: 43.10
        description_key: forms.freelance.efka.category.engineer_description
  agricultural:
    tax_brackets:
      - upper: 10000
        rate: 0.09
      - upper: 20000
        rate: 0.22
      - upper: 30000
        rate: 0.28
      - upper: 40000
        rate: 0.36
      - rate: 0.44
  other:
    tax_brackets:
      - upper: 10000
        rate: 0.09
      - upper: 20000
        rate: 0.22
      - upper: 30000
        rate: 0.28
      - upper: 40000
        rate: 0.36
      - rate: 0.44
  rental:
    tax_brackets:
      - upper: 12000
        rate: 0.15
      - upper: 35000
        rate: 0.35
      - rate: 0.45
  investment:
    rates:
      dividends: 0.05
      interest: 0.15
      capital_gains: 0.15
      royalties: 0.20
deductions:
  rules:
    # Article 19 ΚΦΕ: 20% of donations, only if they exceed 100 in the year;
    # donations count up to 5% of taxable income.
    donations:
      credit_rate: 0.20
      income_cap_rate: 0.05
      min_total_amount: 100
    medical:
      credit_rate: 0.10
      income_threshold_rate: 0.05
      max_credit: 3000
  hints:
    - id: dependents.children
      applies_to:
        - employment
        - pension
      label_key: forms.dependents.children
      description_key: forms.dependents.children_hint
      input_id: children-input
      validation:
        type: integer
        min: 0
        max: 10
    - id: freelance.mandatory_contributions
      applies_to:
        - freelance
      label_key: forms.freelance.mandatory_contributions
      description_key: forms.freelance.mandatory_contributions_hint
      input_id: freelance-contributions
      validation:
        type: currency
        min: 0
      allowances:
        - label_key: forms.freelance.mandatory_contributions_allowance.label
          description_key: forms.freelance.mandatory_contributions_allowance.description
          thresholds:
            - label_key: forms.freelance.mandatory_contributions_allowance.threshold.standard
              percentage: 1.0
    - id: rental.deductible_expenses
      applies_to:
        - rental
      label_key: forms.rental.deductible_expenses
      description_key: forms.rental.deductible_expenses_hint
      input_id: rental-expenses
      validation:
        type: currency
        min: 0
      allowances:
        - label_key: forms.rental.deductible_expenses_allowance.label
          description_key: forms.rental.deductible_expenses_allowance.description
          thresholds:
            - label_key: forms.rental.deductible_expenses_allowance.threshold.documented
              notes_key: forms.rental.deductible_expenses_allowance.threshold.documented_note
    - id: obligations.luxury
      applies_to:
        - luxury
      label_key: forms.obligations.luxury
      description_key: forms.obligations.luxury_hint
      input_id: luxury-due
      validation:
        type: currency
        min: 0
      allowances:
        - label_key: forms.obligations.luxury_allowance.label
          description_key: forms.obligations.luxury_allowance.description
          thresholds:
            - label_key: forms.obligations.luxury_allowance.threshold.statement
              notes_key: forms.obligations.luxury_allowance.threshold.statement_note
    - id: deductions.donations
      applies_to:
        - deductions
      label_key: forms.deductions.donations
      description_key: forms.deductions.donations_hint
      input_id: deductions-donations
      validation:
        type: currency
        min: 0
    - id: deductions.medical
      applies_to:
        - deductions
      label_key: forms.deductions.medical
      description_key: forms.deductions.medical_hint
      input_id: deductions-medical
      validation:
        type: currency
        min: 0
warnings:
  - id: employment.partial_year_review
    severity: warning
    applies_to:
      - employment
      - pension
    message_key: warnings.employment.partial_year_review
    documentation_key: warnings.links.partial_year_review
    documentation_url: https://www.sepenet.gr/el/library/content/apolysi-symvasi-ergasias
