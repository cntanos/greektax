rules:
  # Youth relief age = age_reference_year - birth year (defaults to the tax year).
  age_reference_year: 2026
  youth_bands:
    under_25: 25
    age26_30: 30
  youth_relief_categories: [employment, freelance, agricultural]
  residency_transfer_taxable_share: 0.5
  max_birth_year_with_income: 2025
  salary_credit:
    # Article 16 ΚΦΕ: the credit reduces the tax on salaries and pensions, and on
    # agricultural income where the farmer qualifies; it falls by 20 per 1,000 of
    # that taxable income above 12,000 (not for 5+ dependent children).
    income_categories: [employment, pension, agricultural]
    reduction_threshold: 12000
    reduction_step: 1000
    reduction_per_step: 20
